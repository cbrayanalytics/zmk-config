## --- DISPLAY CORE ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=16

## --- STANDARD WIDGETS ---
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

## --- BONGO CAT / CUSTOM SCREEN MODULE ---
# CONFIG_ZMK_DONGLE_DISPLAY=y
# CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
# CONFIG_ZMK_DONGLE_DISPLAY_BATTERY=y
# CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y
# CONFIG_ZMK_DONGLE_DISPLAY_OUTPUT=y

# 128x32‑friendly framebuffer settings
CONFIG_LV_Z_VDB_SIZE=32
CONFIG_LV_COLOR_DEPTH_1=y

## --- BATTERY REPORTING ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

## --- LOW POWER STATES ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_IDLE_TIMEOUT=15000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=500000

## --- ZMK STUDIO ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=700
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

## --- DEBOUNCE (More conservative for reliability) ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

## --- BLUETOOTH RELIABILITY ---
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

